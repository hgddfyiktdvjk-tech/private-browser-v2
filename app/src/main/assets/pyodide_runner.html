<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
<script>
var pyodideInstance = null;
var micropipLoaded = false;

async function initPyodide() {
    try {
        pyodideInstance = await loadPyodide({
            indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
        });
        pyodideInstance.setStdout({ batched: function(s) { Android.onPythonOutput(s); } });
        pyodideInstance.setStderr({ batched: function(s) { Android.onPythonOutput(s); } });
        Android.onPyodideReady();
    } catch (err) {
        Android.onPyodideError(err.toString());
    }
}

async function runPythonCode(code) {
    if (!pyodideInstance) {
        Android.onPythonError("بايثون لسا ما جهز، انتظر شوي وحاول ثانية");
        return;
    }
    try {
        await pyodideInstance.runPythonAsync(code);
        Android.onPythonDone();
    } catch (err) {
        Android.onPythonError(err.toString());
    }
}

async function installPackage(name) {
    if (!pyodideInstance) {
        Android.onPackageError(name, "بايثون لسا ما جهز");
        return;
    }
    try {
        if (!micropipLoaded) {
            await pyodideInstance.loadPackage("micropip");
            micropipLoaded = true;
        }
        const micropip = pyodideInstance.pyimport("micropip");
        await micropip.install(name);
        Android.onPackageInstalled(name);
    } catch (err) {
        Android.onPackageError(name, err.toString());
    }
}

initPyodide();
</script>
</body>
</html>
